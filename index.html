      renderTodoList();
      renderTodoGrid();
      showToast(`已删除「${todo.text}」`, () => {
        const target = todoGroups.find(x => x.id === gid);
        if (!target) return;
        target.todos.splice(Math.min(idx, target.todos.length), 0, todo);
        persistTodos();
        renderTodoList();
        renderTodoGrid();
      });
      return;
    }

    todo.done = !todo.done;
    bumpStat('todo', todo.done ? +1 : -1);
    persistTodos();
    renderTodoList();
    renderTodoGrid();
    buzz(8);
  });

  $('#tgDelete').addEventListener('click', () => {
    const g = todoGroups.find(x => x.id === currentTGId);
    if (!g) return;
    const n = g.todos.length;
    const msg = n > 0
      ? `删除分组「${g.name}」及其中 ${n} 条待办？`
      : `删除分组「${g.name}」？`;
    if (!confirm(msg)) return;
    todoGroups = todoGroups.filter(x => x.id !== g.id);
    persistTodos();
    closeTodoGroup();
    renderTodoGrid();
  });

  $('#tgClose').addEventListener('click', closeTodoGroup);

  /* ---------- 点击遮罩关闭 ---------- */
  function bindBackdropClose(dialog, closeFn) {
    dialog.addEventListener('click', (e) => {
      if (e.target !== dialog) return;
      const r = dialog.getBoundingClientRect();
      const inside = e.clientX >= r.left && e.clientX <= r.right &&
                     e.clientY >= r.top && e.clientY <= r.bottom;
      if (!inside) closeFn();
    });
  }
  bindBackdropClose(hgDialog, closeHabitGroup);
  bindBackdropClose(tgDialog, closeTodoGroup);

  /* =====================================================
     布局切换 & 全局尺寸
     ===================================================== */
  function setLayout(mode) {
    if (mode !== 'float') mode = 'grid';
    if (layoutMode === mode) return;

    if (physics.drag) {
      try { physics.drag.el.releasePointerCapture(physics.drag.pointerId); } catch (e) {}
      physics.drag.el.classList.remove('dragging');
      physics.drag = null;
    }

    layoutMode = mode;
    save(K_LAYOUT, mode);

    document.querySelectorAll('.layout-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.layout === mode);
    });

    habitGridEl.classList.toggle('float-mode', mode === 'float');
    todoGridEl.classList.toggle('float-mode', mode === 'float');

    renderAll();

    if (mode === 'float') {
      updatePhysics();
      showToast('漂浮模式：拖拽可移动，📌 固定位置');
    } else {
      stopPhysics();
    }
  }

  $('.layout-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-layout]');
    if (!btn) return;
    setLayout(btn.dataset.layout);
  });

  $('#sizeRange').addEventListener('input', (e) => {
    baseSize = clamp(parseInt(e.target.value, 10) || 96, 56, 150);
    applyBaseSize();
    save(K_SIZE, baseSize);
    renderAll();
    if (layoutMode === 'float') clampAllPositions();
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (layoutMode !== 'float') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      clampAllPositions();
      renderAll();
    }, 120);
  });

  $('#habitGroupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#habitGroupInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    habitGroups.unshift({
      id: uid(), name: name, icon: '📁', size: 1, pinned: false,
      habits: [], vx: 0, vy: 0
    });
    persistHabits();
    input.value = '';
    input.focus();
    renderHabitGrid();
  });

  $('#todoGroupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#todoGroupInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    todoGroups.unshift({
      id: uid(), name: name, icon: '📋', size: 1, pinned: false,
      todos: [], vx: 0, vy: 0
    });
    persistTodos();
    input.value = '';
    input.focus();
    renderTodoGrid();
  });

  /* ---------- Toast ---------- */
  // 注：toastTimer / toastUndo 已在文件顶部声明（TDZ 修复），此处不再重复声明
  function showToast(msg, onUndo) {
    const t = $('#toast');
    const undoBtn = $('#toastUndo');
    $('#toastMsg').textContent = msg;
    undoBtn.hidden = typeof onUndo !== 'function';
    toastUndo = typeof onUndo === 'function' ? onUndo : null;
    t.classList.add('active');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4000);
  }
  function hideToast() {
    clearTimeout(toastTimer);
    $('#toast').classList.remove('active');
    toastUndo = null;
  }
  $('#toastUndo').addEventListener('click', () => {
    const fn = toastUndo;
    hideToast();
    if (fn) fn();
  });

  /* ---------- 视图切换 ---------- */
  function setView(view) {
    if (view !== 'todo') view = 'habit';
    currentView = view;

    $('#panelHabit').hidden = view !== 'habit';
    $('#panelTodo').hidden = view !== 'todo';

    document.querySelectorAll('#tabs button').forEach((b) => {
      const on = b.dataset.view === view;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });

    save(K_VIEW, view);

    if (layoutMode === 'float') {
      const grid = currentGridEl();
      ensurePositions(grid, currentGroups());
      renderFloatGrid(grid, currentGroups(), view);
      updatePhysics();
    }
  }

  $('#tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    setView(btn.dataset.view);
  });

  /* =====================================================
     主题 / 风格
     ===================================================== */
  const mqDark = window.matchMedia('(prefers-color-scheme: dark)');

  function currentIsDark() {
    const pref = localStorage.getItem(K_THEME);
    return pref ? pref === 'dark' : mqDark.matches;
  }

  function applyThemeColor() {
    const dark = currentIsDark();
    const pair = THEME_COLOR[currentStyle] || THEME_COLOR.minimal;
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? pair[1] : pair[0]);
  }

  function applyTheme() {
    const dark = currentIsDark();
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const btn = $('#themeBtn');
    btn.textContent = dark ? '☀️' : '🌙';
    btn.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
    applyThemeColor();
  }

  function applyStyle(notify) {
    document.documentElement.dataset.style = currentStyle;
    const meta = STYLE_META[currentStyle];
    const btn = $('#styleBtn');
    if (btn) {
      btn.textContent = meta.icon;
      btn.setAttribute('aria-label', '当前风格：' + meta.name + '，点击切换');
      btn.title = '当前风格：' + meta.name;
    }
    applyThemeColor();
    if (notify) showToast('已切换为「' + meta.name + '」');
  }

  const STYLES = ['minimal', 'magazine', 'sketch'];
  const STYLE_META = {
    minimal:  { icon: '🎨', name: '简约' },
    magazine: { icon: '📰', name: '杂志感' },
    sketch:   { icon: '✏️', name: '手绘感' }
  };
  const THEME_COLOR = {
    minimal:  ['#f5f3ee', '#181b20'],
    magazine: ['#f2efe9', '#0e0e0e'],
    sketch:   ['#fdf7ea', '#26211c']
  };
  const ICON_SETS = {
    habit: ['🌱','💧','🏃','📚','🧘','💪','🌙','🥗','🚴','📝','🎯','💼','🏠','📋','🎨','🎵','☀️','🔥','🍎','😴','🦷','🚿','🧹','💰','📖','✍️','🧠','❤️','🏊','⛰️','🎸','🐾'],
    todo: ['💼','🏠','🛒','📚','🎯','💡','🎨','🎵','📱','✈️','🏥','📋','💰','📞','📦','🧾','🔧','🚗','🎁','🍽️','🐶','🌐','📅','⭐']
  };

  const savedStyle = load(K_STYLE, 'minimal');
  let currentStyle = STYLES.indexOf(savedStyle) >= 0 ? savedStyle : 'minimal';

  $('#styleBtn').addEventListener('click', () => {
    const i = STYLES.indexOf(currentStyle);
    currentStyle = STYLES[(i + 1) % STYLES.length];
    save(K_STYLE, currentStyle);
    applyStyle(true);
  });

  $('#themeBtn').addEventListener('click', () => {
    const isDark = document.documentElement.dataset.theme === 'dark';
    localStorage.setItem(K_THEME, isDark ? 'light' : 'dark');
    applyTheme();
  });

  const onSchemeChange = () => { if (!localStorage.getItem(K_THEME)) applyTheme(); };
  if (mqDark.addEventListener) mqDark.addEventListener('change', onSchemeChange);
  else if (mqDark.addListener) mqDark.addListener(onSchemeChange);

  function buildIconPicker(pickerEl, icons) {
    pickerEl.innerHTML =
      '<div class="icon-grid">' +
        icons.map(ic =>
          `<button type="button" class="icon-choice" data-icon="${esc(ic)}" aria-label="使用图标 ${esc(ic)}">${esc(ic)}</button>`
        ).join('') +
      '</div>' +
      '<button type="button" class="icon-upload" aria-label="从设备选择图片作为图标">' +
        '<span aria-hidden="true">🖼️</span> 从设备选择图片' +
      '</button>';
  }

  function syncPickerActive(pickerEl, currentIcon) {
    pickerEl.querySelectorAll('.icon-choice').forEach((b) => {
      b.classList.toggle('active', b.dataset.icon === currentIcon);
    });
  }

  buildIconPicker($('#hgIconPicker'), ICON_SETS.habit);
  buildIconPicker($('#tgIconPicker'), ICON_SETS.todo);

  /* =====================================================
     导出 / 导入
     ===================================================== */
  $('#exportBtn').addEventListener('click', () => {
    flushAllPersisters();
    const data = {
      version: 6,
      exportedAt: new Date().toISOString(),
      layout: layoutMode,
      baseSize: baseSize,
      style: currentStyle,
      habitGroups: habitGroups,   // 习惯的 toJSON 会自动输出紧凑的 d 数组
      todoGroups: todoGroups,
      stats: stats
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'habits-todos-' + dkey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('已导出备份文件（含累计进度）');
  });

  $('#importBtn').addEventListener('click', () => $('#importFile').click());

  $('#importFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();

    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        let nextHG, nextTG;

        if (Array.isArray(data.habitGroups) && Array.isArray(data.todoGroups)) {
          nextHG = data.habitGroups.map(normalizeHabitGroup);
          nextTG = data.todoGroups.map(normalizeTodoGroup);
        } else if (Array.isArray(data.habits) && Array.isArray(data.todos)) {
          nextHG = data.habits.length
            ? [{ id: uid(), name: '我的习惯', icon: '📁', size: 1, pinned: false, habits: data.habits.map(normalizeHabit), vx: 0, vy: 0 }]
            : [];
          nextTG = data.todos.length
            ? [{ id: uid(), name: '我的待办', icon: '📋', size: 1, pinned: false, todos: data.todos.map(normalizeTodo).filter(t => t.text), vx: 0, vy: 0 }]
            : [];
        } else {
          throw new Error('文件格式不正确');
        }

        if (!confirm('导入将覆盖当前数据，继续？')) return;

        habitGroups = nextHG;
        todoGroups = nextTG;

        if (data.stats && typeof data.stats === 'object') {
          const clean = (v) => (typeof v === 'number' && isFinite(v)) ? Math.max(0, Math.floor(v)) : 0;
          stats.habitTotal = clean(data.stats.habitTotal);
          stats.todoTotal = clean(data.stats.todoTotal);
          persistStats();
          renderGoals();
        }

        if (typeof data.baseSize === 'number') {
          baseSize = clamp(parseInt(data.baseSize, 10) || 96, 56, 150);
          applyBaseSize();
          save(K_SIZE, baseSize);
        }

        if (typeof data.style === 'string' && STYLES.indexOf(data.style) >= 0) {
          currentStyle = data.style;
          save(K_STYLE, currentStyle);
          applyStyle(false);
        }

        const okH = save(K_HG, habitGroups);
        const okT = save(K_TG, todoGroups);
        if (!okH || !okT) {
          alert('导入的数据过大（可能含较多图片），本地存储空间不足，部分内容可能未保存。');
        }

        closeHabitGroup();
        closeTodoGroup();
        renderAll();

        if (typeof data.layout === 'string') setLayout(data.layout);
        else if (layoutMode === 'float') updatePhysics();

        showToast('导入成功');
      } catch (err) {
        alert('导入失败：' + (err && err.message ? err.message : '未知错误'));
      }
    };
    reader.onerror = () => alert('读取文件失败');
    reader.readAsText(file);
    e.target.value = '';
  });

  /* =====================================================
     日期显示 & 跨日刷新
     ===================================================== */
  function renderDate() {
    const d = new Date();
    $('#todayLabel').textContent =
      d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + WEEK[d.getDay()];
  }

  let currentDay = dkey();
  function checkDayRollover() {
    const k = dkey();
    if (k === currentDay) return;
    currentDay = k;
    renderDate();
    renderAll();
    if ($('#habitGroupDialog').open) renderHabitList();
    if ($('#todoGroupDialog').open) renderTodoList();
  }

  /* =====================================================
     启动
     ===================================================== */
  function init() {
    applyStyle(false);
    applyTheme();
    applyBaseSize();
    renderDate();
    renderGoals();

    // 首次加载时做一次记录裁剪；若发生迁移则立刻落盘紧凑格式
    let migrated = false;
    const raw = load(K_HG, null);
    if (Array.isArray(raw)) {
      for (const g of raw) {
        if (!g || !Array.isArray(g.habits)) continue;
        for (const h of g.habits) {
          if (h && h.records && !h.d) migrated = true;
        }
      }
    }
    if (pruneRecords() || migrated) persistHabits();

    habitGridEl.classList.toggle('float-mode', layoutMode === 'float');
    todoGridEl.classList.toggle('float-mode', layoutMode === 'float');
    document.querySelectorAll('.layout-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.layout === layoutMode);
    });

    setView(load(K_VIEW, 'habit'));
    renderAll();

    if (layoutMode === 'float') {
      updatePhysics();
    }

    setTimeout(() => {
      renderAll();
      if (layoutMode === 'float') {
        clampAllPositions();
      }
    }, 100);

    setInterval(checkDayRollover, 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkDayRollover();
        if (layoutMode === 'float') {
          physics.lastTime = 0;
          updatePhysics();
        }
      } else {
        flushAllPersisters();
      }
    });
  }

  init();
})();
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('[PWA] SW 注册成功：', reg.scope);

          // 场景 1：页面打开时，已经有 waiting 的新版本
          if (reg.waiting) {
            showUpdatePrompt(reg);
          }

          // 场景 2：监听新版本安装完成
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdatePrompt(reg);
              }
            });
          });

          // 每次启动主动查一次更新
          reg.update().catch(() => {});
        })
        .catch((err) => console.warn('[PWA] SW 注册失败：', err));

      // 新 SW 接管页面时，自动刷新一次（避免死循环）
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }

  /* ---------- 更新提示条 ---------- */
  function showUpdatePrompt(reg) {
    if (document.getElementById('swUpdateBar')) return;

    const bar = document.createElement('div');
    bar.id = 'swUpdateBar';
    bar.innerHTML = `
      <span>🚀 发现新版本，点击刷新获取最新功能</span>
      <button type="button" id="swUpdateBtn">立即刷新</button>
    `;

    Object.assign(bar.style, {
      position: 'fixed',
      left: '50%',
      bottom: '20px',
      transform: 'translateX(-50%)',
      display: 'flex',
      alignItems: 'center',
      gap: '12px',
      padding: '12px 16px',
      background: 'var(--card-bg, #fff)',
      color: 'var(--text, #333)',
      border: '1px solid var(--card-border, #ddd)',
      borderLeft: '4px solid var(--accent, #4a9e8a)',
      borderRadius: '10px',
      boxShadow: '0 8px 28px rgba(0,0,0,.18)',
      fontSize: '.85rem',
      zIndex: '9999',
      maxWidth: 'calc(100vw - 32px)'
    });

    const btn = bar.querySelector('#swUpdateBtn');
    Object.assign(btn.style, {
      padding: '6px 12px',
      background: 'var(--accent, #4a9e8a)',
      color: '#fff',
      border: '0',
      borderRadius: '6px',
      cursor: 'pointer',
      fontSize: '.8rem',
      fontWeight: '600',
      flexShrink: '0'
    });

    btn.addEventListener('click', () => {
      btn.disabled = true;
      btn.textContent = '刷新中…';
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      } else {
        window.location.reload();
      }
    });

    document.body.appendChild(bar);
  }
  </script>
</body>
