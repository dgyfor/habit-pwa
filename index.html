<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-style="minimal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>习惯 &amp; 待办</title>
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- iOS 专属支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="习惯待办">
  <link rel="apple-touch-icon" href="icon-192.png">
<script>
(function () {
  try {
    var t = localStorage.getItem('ht_theme_v1');
    var s = localStorage.getItem('ht_style_v1');
    if (t) document.documentElement.dataset.theme = t;
    if (s) document.documentElement.dataset.style = s;
  } catch (e) {}
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    color-scheme: light;
    --base-size: 96px;
    --font: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', 'Segoe UI', sans-serif;

    --radius: 14px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --transition: .25s cubic-bezier(.4, 0, .2, 1);

    --bg: #f5f3ee;
    --bg-secondary: #eeebe4;
    --card-bg: #ffffff;
    --card-border: #e4dfd6;
    --text: #3a3a38;
    --text-secondary: #6b6a66;
    --text-muted: #9a9892;

    --accent: #4a9e8a;
    --accent-hover: #3d8a78;
    --accent-light: #e8f4f0;
    --accent-border: #b8dcd2;
    --accent-ring: rgba(74, 158, 138, .14);

    --input-bg: #faf9f7;
    --input-border: #ddd9d0;

    --danger: #c4726a;
    --danger-light: #f9eae8;
    --success: #5ba88d;
    --success-light: #e8f4f0;

    --progress-bg: #eae7e0;
    --overlay: rgba(60, 55, 50, .35);

    --m1: #4a9e8a;
    --m2: #5b8db8;

    --grad-m1: linear-gradient(145deg, #6bbfae 0%, #4a9e8a 55%, #3d8a78 100%);
    --grad-m2: linear-gradient(145deg, #7ba6cc 0%, #5b8db8 55%, #477ba8 100%);
    --folder-shadow: rgba(74, 158, 138, .38);
    --folder-shadow-2: rgba(91, 141, 184, .38);
    --folder-inset: inset 0 1px 0 rgba(255, 255, 255, .32);
    --folder-radius: calc(var(--block-size, 96px) * .24);
    --folder-ink: rgba(0, 0, 0, .12);

    --toast-bg: #ffffff;
    --toast-text: #3a3a38;

    --shadow: 0 2px 16px rgba(0, 0, 0, .06), 0 1px 4px rgba(0, 0, 0, .04);
    --shadow-hover: 0 6px 28px rgba(0, 0, 0, .10), 0 2px 8px rgba(0, 0, 0, .06);
    --shadow-modal: 0 20px 60px rgba(0, 0, 0, .18);
    --shadow-toast: 0 8px 32px rgba(0, 0, 0, .16);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #181b20;
    --bg-secondary: #202328;
    --card-bg: #252a30;

    --danger: #c97a72;
    --danger-light: #332522;
    --success: #6bb5a0;
    --success-light: #1e332d;

    --progress-bg: #32373e;
    --overlay: rgba(0, 0, 0, .60);

    --m1: #6bb5b0;
    --m2: #7b9ec7;

    --grad-m1: linear-gradient(145deg, #4f9d96 0%, #3d7d78 55%, #2f625e 100%);
    --grad-m2: linear-gradient(145deg, #63809c 0%, #4e6b87 55%, #3c5570 100%);
    --folder-shadow: rgba(0, 0, 0, .45);
    --folder-shadow-2: rgba(0, 0, 0, .45);
    --folder-inset: inset 0 1px 0 rgba(255, 255, 255, .14);
    --folder-ink: rgba(255, 255, 255, .14);

    --toast-bg: #2a2f36;
    --toast-text: #d4d6da;

    --shadow: 0 2px 16px rgba(0, 0, 0, .30), 0 1px 4px rgba(0, 0, 0, .20);
    --shadow-hover: 0 6px 28px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .30);
    --shadow-modal: 0 20px 60px rgba(0, 0, 0, .60);
    --shadow-toast: 0 8px 32px rgba(0, 0, 0, .50);
  }

  /* ============================================================

  html[data-style="magazine"] {

  html[data-theme="dark"][data-style="magazine"] {
    --bg: #0e0e0e;

    --card-bg: #171717;

    --text: #f2efe9;

    --danger: #ff4433;

    --m1: #eae7e1;

    --grad-m1: #eae7e1;
    --grad-m2: #ff4433;
    --folder-shadow: rgba(0, 0, 0, .60);
    --folder-shadow-2: rgba(255, 68, 51, .35);

    --toast-bg: #f2efe9;
